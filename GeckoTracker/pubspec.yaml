name: gecko_tracker
description: "A tracking application for Leopard Geckos (Eublepharis)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  fl_chart: ^0.66.2
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
